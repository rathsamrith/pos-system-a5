<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RCR Mart · POS</title>
    <meta name="description" content="RCR Mart point-of-sale demo" />
    <link rel="icon" href="image/LOGO/Frame 2.png" type="image/png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400,0..1,0&display=block"
    />
    <link rel="stylesheet" href="css/app.css" />
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      try {
        const pref = JSON.parse(localStorage.getItem("rcr-pos:v1"))?.settings?.theme || "system";
        const dark = pref === "dark" || (pref === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
      } catch {}
    </script>
  </head>
  <body>
    <div class="app">
      <aside class="sidebar" id="nav"></aside>
      <main class="view" id="view"></main>
    </div>

    <noscript><p class="boot-error">This app needs JavaScript enabled.</p></noscript>
    <script>
      // ES modules don't load from file:// — explain instead of showing a blank page.
      if (location.protocol === "file:") {
        document.body.innerHTML =
          '<div class="boot-error"><h1>Run with a local server</h1><p>This app uses ES modules, which browsers block on <code>file://</code>.</p>' +
          "<p>From the project folder run <code>npm start</code> (or <code>npx serve .</code> / <code>python -m http.server</code>) " +
          "and open the URL it prints. In VS Code, the Live Server extension works too.</p></div>";
      }
    </script>
    <script type="module" src="js/main.js"></script>
  </body>
</html>
